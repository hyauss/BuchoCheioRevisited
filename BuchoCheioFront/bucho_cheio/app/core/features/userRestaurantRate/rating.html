<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="userRestaurantRateStyle.css">
    <title>Bucho Cheio - Avaliação</title>
</head>
<body>
    <custom-header></custom-header>
    
    <main>
        <section class="sectionRestauranteInfo">
            <article class="restaurantTitleSection">
                <div class="restaurantHeading">
                    <a href="../userMenu/menu.html">
                        <span role="img" aria-label="Voltar" class="backButton"></span>
                    </a>
                    <h1 class="text titleText" id="restaurantName">Nome Restaurante</h1>
                </div>
                <div class="rateText">
                    <h1 class="text titleText">Avaliação</h1>
                </div>
                <div class="restaurantRating" id="restaurantRating" aria-live="polite">
                    <span class="ratingAverage" id="ratingAverage">Sem avaliações</span>
                </div>
            </article>
            <article class="ratingCardsSection">
                <button class="rateButtonText grayButton" id="openRatingDialog" type="button">Avaliação</button>
                <div class="ratingCardsScroll" id="restaurantRatings"></div>
            </article>
        </section>
        <section class="restInfoCard">
            <img id="restaurantImage" src="Assets/tiozao.png" alt="Restaurante foto">
            <div class="restaurentImages" id="restaurantImages"></div>
            <footer>
                <p id="restaurantInfoName">Restaurante XXXX</p>
                <p id="restaurantInfoCnpj">CNPJ: xxxx.ssss.gggg.eee</p>
                <p id="restaurantInfoAddress">Endereço: Rua yyyyyyyyy, 234</p>
            </footer>
        </section>
    </main>

    <dialog class="ratingDialog" id="ratingDialog">
        <form method="dialog" class="ratingDialogContent" id="ratingForm">
            <button class="ratingDialogClose" type="submit" aria-label="Fechar"><span aria-hidden="true"></span></button>
            <h2>Avaliar restaurante</h2>
            <div class="restaurantRatingCard ratingStars" id="ratingStars" role="group" aria-label="Escolha a nota">
                <button type="button" class="ratingStar" data-rating="1" aria-label="1 estrela"><span class="ratingButtonStar" aria-hidden="true"></span></button>
                <button type="button" class="ratingStar" data-rating="2" aria-label="2 estrelas"><span class="ratingButtonStar" aria-hidden="true"></span></button>
                <button type="button" class="ratingStar" data-rating="3" aria-label="3 estrelas"><span class="ratingButtonStar" aria-hidden="true"></span></button>
                <button type="button" class="ratingStar" data-rating="4" aria-label="4 estrelas"><span class="ratingButtonStar" aria-hidden="true"></span></button>
                <button type="button" class="ratingStar" data-rating="5" aria-label="5 estrelas"><span class="ratingButtonStar" aria-hidden="true"></span></button>
            </div>
            <label class="ratingCommentLabel" for="ratingComment">Comentário</label>
            <textarea id="ratingComment" name="ratingComment" rows="5" placeholder="Conte o que achou..."></textarea>
            <button class="grayButton ratingDialogSubmit" id="submitRating" type="submit">Avaliar</button>
        </form>
    </dialog>

    <footer class="mainPagesFooter footerText">footerInformation</footer>

    <script src="../../DesingSystem/Components/components.js"></script>
    <script type="module" src="./rating.js"></script>
</body>
</html>
