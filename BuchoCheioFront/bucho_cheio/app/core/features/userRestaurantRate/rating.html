<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="userRestaurantRateStyle.css"> -->
    <title>Bucho Cheio</title>
</head>
<body>
    <header>
        <button>
            <img class="headerImages" src="Assests/fork.knife.circle.png" alt="Imagem contendo um garfo e uma faca.">
        </button>
        <button class=" text headerText" aria-label="Home" >Home</button>
        <button class=" text headerText" aria-label="Resturante">Resturante</button>
        <button class=" text headerText" aria-label="Cadastrar">Cadastrar</button>
        <button class=" text headerText" aria-label="Relatórios">Relatórios</button>
        <button class=" text headerText" aria-label="Meus restaurantes">Meus restaurantes</button>
        <button class="profileImage">
            <img class="headerImages" src="Assests/person.crop.circle.png" alt="Imagem de perfil">
        </button>
    </header>
    <main>
        <section class="restaurantTitleSection">
            <div class="restaurantHeading">
                <a href="https://www.exemplo.com">
                    <img src="Assests/chevron.left.circle.svg" alt="back" class="backButton">
                </a>
                <h1 class="text titleText">Nome Restaurante</h1>
            </div>
            <div class="rateText">
                <h1 class="text titleText">Avaliação</h1>
            </div>
            <div class="restaurantRating">
                <img src="Assests/star.png" alt="Estrela de avaliação">
                <img src="Assests/star.png" alt="Estrela de avaliação">
                <img src="Assests/star.png" alt="Estrela de avaliação">
                <img src="Assests/star.png" alt="Estrela de avaliação">
                <img src="Assests/star.png" alt="Estrela de avaliação">
            </div>
        </section>
        <section class="rateButtonBox">
            <button class="rateButtonText" type="button">Avaliação</button>
        </section>
    </main>
</body>
</html>
