<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <template>
        <header>
            <button>
                <img class="headerImages" src="Assests/fork.knife.circle.png" alt="Imagem contendo um garfo e uma faca.">
            </button>
            <button class=" text headerText" aria-label="Home" >Home</button>
            <button class=" text headerText" aria-label="Resturante">Resturante</button>
            <button class=" text headerText" aria-label="Cadastrar">Cadastrar</button>
            <button class=" text headerText" aria-label="Relatórios">Relatórios</button>
            <button class=" text headerText" aria-label="Meus restaurantes">Meus restaurantes</button>
            <button class="profileImage">
                <img class="headerImages" src="Assests/person.crop.circle.png" alt="Imagem de perfil">
            </button>
        </header>
    </template>
    
    <main>
        <section class="informationSection">
            <h1 class="text titleText">Bucho Cheio</h1>
            <p class="text pText">Esse sistema permite que usuários consultem, avaliem e obtenham relatórios sobre os restaurantes e que os restaurantes cadastrem e atualizem seus cardapios</p>
        </section>
        <section class="navigationSection">
            <nav>
                <button>
                    <img class="navigationSectionImagens" src="Assests/consultarRestaurantes.png" alt="Garfo e faca pretos em fundo branco">
                </button>
                <aside class="text imageLabelText">Consultar restaurantes</aside>
            </nav>
            <nav>
                <button>
                    <img class="navigationSectionImagens" src="Assests/cadastrarRestaurantes.png" alt="Símbolo de mais preto em fundo branco">
                </button>
                <aside class="text imageLabelText">Cadastrar Restaurantes</aside>
            </nav>
            <nav>
                <button>
                    <img class="navigationSectionImagens" src="Assests/obterRelatorio.png" alt="Mapa preto em fundo branco">
                </button>
                <aside class="text imageLabelText">Obter Relatórios</aside>
            </nav>
        </section>
        <footer class="footerText">footerInformation</footer>
    </main>
</body>
</html>
