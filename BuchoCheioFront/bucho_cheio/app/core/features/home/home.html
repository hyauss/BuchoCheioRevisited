<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <custom-header active="home"></custom-header>
    
    <main>
        <section class="informationSection">
            <h1 class="text titleText">Bucho Cheio</h1>
            <p class="text pText">Esse sistema permite que usuários consultem, avaliem e obtenham relatórios sobre os restaurantes e que os restaurantes cadastrem e atualizem seus cardapios</p>
        </section>
        <section class="navigationSection">
            <article>
                <button onclick="window.location.href='../restaurantes/restaurantes.html'">
                    <img class="navigationSectionImagens" src="Assets/consultarRestaurantes.png" alt="Garfo e faca pretos em fundo branco">
                </button>
                <aside class="text imageLabelText">Consultar restaurantes</aside>
            </article>
            <article>
                <button>
                    <img class="navigationSectionImagens" src="Assets/cadastrarRestaurantes.png" alt="Símbolo de mais preto em fundo branco">
                </button>
                <aside class="text imageLabelText">Cadastrar Restaurantes</aside>
            </article>
            <article>
                <button>
                    <img class="navigationSectionImagens" src="Assets/obterRelatorio.png" alt="Mapa preto em fundo branco">
                </button>
                <aside class="text imageLabelText">Obter Relatórios</aside>
            </article>
        </section>
    </main>

    <custom-footer></custom-footer>

    <script src="../../DesingSystem/Components/components.js"></script>
</body>
</html>
